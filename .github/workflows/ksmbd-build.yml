name: ksmbd kernel modules

# Builds kano's mainline kernel + in-tree modules with our SMB fragment and
# publishes ksmbd.ko. kano cuts no releases, so this triggers on SOURCE
# changes (pushes to tf-7.2, which include the daily sync merges) instead
# of release tags; a run whose inputs match an existing release skips.
on:
  push:
    branches: [tf-7.2]
    paths: ['upstream/**', 'custom/ksmbd.fragment', '.github/workflows/ksmbd-build.yml']
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      kv:
        description: 'Kernel version (default: 6.18.54 = the device kernel)'
        required: false

permissions:
  contents: write

env:
  KV_DEFAULT: 6.18.54

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tf-7.2
          fetch-depth: 0

      - name: Resolve inputs and skip check
        id: skip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KV="${{ github.event.inputs.kv }}"
          [ -n "$KV" ] || KV="$KV_DEFAULT"
          echo "$KV" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad KV: $KV"; exit 1; }
          echo "KV=$KV" >> "$GITHUB_ENV"
          KANO_SHA=$(git ls-remote https://github.com/kanoqwq/mu300-linux.git clean-tf-7.2 | cut -f1)
          [ -n "$KANO_SHA" ] || { echo "cannot reach kano"; exit 1; }
          echo "KANO_SHA=$KANO_SHA" >> "$GITHUB_ENV"
          FRAG_SHA=$(git log -1 --format=%H -- custom/ksmbd.fragment .github/workflows/ksmbd-build.yml || true)
          [ -n "$FRAG_SHA" ] || FRAG_SHA=$(git rev-parse HEAD)
          echo "FRAG_SHA=$FRAG_SHA" >> "$GITHUB_ENV"
          SKIP=
          for t in $(gh release list --limit 100 --json tagName -q '.[].tagName | select(startswith("own-kernel-"))'); do
            body=$(gh release view "$t" --json body -q .body)
            case "$body" in *"$KV"*"$KANO_SHA"*"$FRAG_SHA"*) SKIP="$t"; break;; esac
          done
          if [ -n "$SKIP" ]; then echo "up to date: $SKIP"; echo "skip=yes" >> "$GITHUB_OUTPUT"; fi

      - name: Build kernel and modules
        if: steps.skip.outputs.skip != 'yes'
        run: |
          docker build -t mu300-mainline-build upstream/
          docker volume rm -f ksmbd-build >/dev/null 2>&1 || true
          docker volume create ksmbd-build
          # our fragment rides along without editing kano's file: this shadow
          # mount replaces it for the build, and build.sh verifies our line too
          cat upstream/mu300-mainline.config custom/ksmbd.fragment > combined-mainline.config
          grep -q '^CONFIG_SMB_SERVER=m$' combined-mainline.config
          docker run --rm -e KV="$KV" -v ksmbd-build:/src -v "$PWD/upstream":/work \
            -v "$PWD/combined-mainline.config:/work/mu300-mainline.config:ro" \
            mu300-mainline-build bash /work/build.sh
          docker run --rm -e KV="$KV" -v ksmbd-build:/src -v "$PWD/upstream":/work \
            mu300-mainline-build bash /work/build-modules.sh > /dev/null
          test -s upstream/out/modules/ksmbd.ko || { echo "ksmbd.ko was not built" >&2; exit 1; }
          mkdir -p rel
          cp upstream/out/modules/ksmbd.ko rel/
          strings rel/ksmbd.ko | grep -m1 '^vermagic=' | cut -d' ' -f1 > rel/vermagic.txt || true
          cat rel/vermagic.txt
          ls -la rel/

      - name: Publish release
        if: steps.skip.outputs.skip != 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y%m%d)
          SHORT=$(echo "$FRAG_SHA" | cut -c1-7)
          TAG="own-kernel-${KV}-${DATE}-${SHORT}"
          (cd rel && sha256sum ksmbd.ko > SHA256SUMS)
          cat rel/SHA256SUMS
          gh release create "$TAG" --title "ksmbd for $KV ($DATE)" --notes "kernel: $KV
          kano clean-tf-7.2: $KANO_SHA
          fragment: $FRAG_SHA
          vermagic: $(cat rel/vermagic.txt)
          device: compare vermagic with the running kernel first (must match),
          then copy ksmbd.ko to /lib/modules/<release>/, depmod, modprobe ksmbd.
          userspace: apk add ksmbd-server wsdd2" \
            rel/ksmbd.ko rel/SHA256SUMS
