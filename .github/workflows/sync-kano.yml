name: Sync kano

# Daily: merge kanoqwq/mu300-linux clean-tf-7.2 into our tracking branch.
# Custom files live where kano never goes (custom/, our workflows):
# a red run means a real conflict to fix by hand, never a silent loss.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tf-7.2
          fetch-depth: 0
      - name: Merge kano/clean-tf-7.2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add kano https://github.com/kanoqwq/mu300-linux.git 2>/dev/null || true
          git fetch kano clean-tf-7.2
          git checkout tf-7.2
          git merge --no-edit kano/clean-tf-7.2 || { echo 'CONFLICT - fix manually'; exit 1; }
          # kano's CI is kano's: this fork runs only its own workflows. GITHUB_TOKEN
          # can never push workflow files, so a merge that adds or edits one under
          # .github/workflows/ is rejected; drop every non-own workflow here to keep
          # the daily push green. The deletion persists into later merges.
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$f" ] || continue
            case "$f" in
              .github/workflows/sync-kano.yml|.github/workflows/tf-magisk-build.yml) ;;
              *) git rm -q -f --ignore-unmatch "$f" ;;
            esac
          done
          git diff --cached --quiet || git commit -q -m "own(ci): drop kano workflows this fork never runs"
          git push origin tf-7.2
