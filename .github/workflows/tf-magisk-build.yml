name: TF Magisk zips

# Full TF-card Magisk zips (OpenWrt, kernels 6.18 + 7.2) the kano way,
# factory only (fresh install; no sysupgrade twin, no desktop installer).
# Flow: resolve (versions + skip check) -> vendor54 (5.4 modules, once) +
# build matrix (mainline, rootfs, zips) -> publish (one release, 2 zips).
# kano cuts no releases, so this triggers on SOURCE changes; inputs come
# from our private device-inputs repo.
on:
  push:
    branches: [tf-7.2]
    paths: ['upstream/**', 'openwrt/**', 'tools/**', 'boot/**', 'custom/**', '.github/workflows/tf-magisk-build.yml']
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      tag: ${{ steps.check.outputs.tag }}
      kv618: ${{ steps.check.outputs.kv618 }}
      kv72: ${{ steps.check.outputs.kv72 }}
      head_sha: ${{ steps.check.outputs.head_sha }}
      inputs_sha: ${{ steps.check.outputs.inputs_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tf-7.2
          fetch-depth: 1
      - name: Versions and skip check
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUTS_SSH_KEY: ${{ secrets.INPUTS_SSH_KEY }}
        run: |
          KV618=6.18.54
          KV72=$(curl -fsSL https://www.kernel.org/releases.json | python3 -c 'import json,sys;r=json.load(sys.stdin)["releases"];print(next(x["version"] for x in r if x["version"].startswith("7.2.")))')
          echo "$KV72" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad 7.2 version: $KV72"; exit 1; }
          echo "kv618=$KV618" >> "$GITHUB_OUTPUT"
          echo "kv72=$KV72" >> "$GITHUB_OUTPUT"
          HEAD_SHA=$(git rev-parse HEAD)
          mkdir -p ~/.ssh
          echo "$INPUTS_SSH_KEY" > ~/.ssh/inputs_key
          chmod 600 ~/.ssh/inputs_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/inputs_key -o StrictHostKeyChecking=no"
          INPUTS_SHA=$(git ls-remote git@github.com:8099bb4X21/mu300-device-inputs.git HEAD | cut -f1)
          rm -f ~/.ssh/inputs_key
          [ -n "$INPUTS_SHA" ] || { echo "cannot reach inputs repo"; exit 1; }
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "inputs_sha=$INPUTS_SHA" >> "$GITHUB_OUTPUT"
          DATE=$(date -u +%Y%m%d)
          TAG="own-tf-${DATE}-$(echo "$HEAD_SHA" | cut -c1-7)-$(echo "$INPUTS_SHA" | cut -c1-7)-$(echo "$KV72" | tr -d .)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          SKIP=
          for t in $(gh release list --limit 100 --json tagName -q '.[].tagName | select(startswith("own-tf-"))'); do
            body=$(gh release view "$t" --json body -q .body)
            printf '%s' "$body" | grep -qFx "base: $HEAD_SHA" || continue
            printf '%s' "$body" | grep -qFx "inputs: $INPUTS_SHA" || continue
            printf '%s' "$body" | grep -qFx "kernels: $KV618 $KV72" || continue
            SKIP="$t"; break
          done
          if [ -n "$SKIP" ]; then echo "up to date: $SKIP"; echo "skip=yes" >> "$GITHUB_OUTPUT"; fi

  vendor54:
    needs: resolve
    if: needs.resolve.outputs.skip != 'yes'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          fetch-depth: 1

      - name: Compute cache key
        id: key
        run: |
          # tree hash of kernel/ covers every input that decides the 5.4 build:
          # scripts, patches, configs, Dockerfile and the pinned KERNEL/MODULES revs
          k="vendor54-$(git ls-tree -r HEAD kernel | git hash-object --stdin)"
          echo "key=$k" >> "$GITHUB_OUTPUT"
          echo "key=$k"

      - name: Restore 5.4 modules
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: work/out/modules
          key: ${{ steps.key.outputs.key }}

      - name: Build 5.4 modules (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          MU300_KERNEL_OUT="$PWD/work/out" sh kernel/build-all.sh

      - name: Verify 5.4 modules
        run: |
          for f in wcn_bsp.ko sprd_wlan_combo.ko sprdbt_tty.ko mali_kbase.ko; do
            [ -s "work/out/modules/$f" ] || { echo "missing/empty 5.4 module $f" >&2; exit 1; }
          done
          n=$(ls work/out/modules/*.ko 2>/dev/null | wc -l)
          [ "$n" -ge 20 ] || { echo "too few modules: $n" >&2; exit 1; }

      - name: Save 5.4 modules (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: work/out/modules
          key: ${{ steps.key.outputs.key }}

      - name: Package modules
        run: tar -czf vendor54-modules.tar.gz -C work/out modules

      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: vendor54-modules
          path: vendor54-modules.tar.gz
          retention-days: 1

  blockmount:
    needs: resolve
    if: needs.resolve.outputs.skip != 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          fetch-depth: 1

      # own: the patched block-mount APK is built from the x86_64-only OpenWrt
      # SDK, so build it once here on a native x86 runner. The arm build jobs
      # download it and build-block-mount.sh's verified-cache check then skips
      # the docker SDK build (emulating that under QEMU took ~85 min per leg).
      - name: Compute cache key
        id: key
        run: |
          # same inputs as the stamp in openwrt/build-block-mount.sh: any change
          # rebuilds, anything else reuses the cached APK
          k="blockmount-$(cat openwrt/block-mount.Dockerfile openwrt/build-block-mount.sh openwrt/build-block-mount-inner.sh openwrt/block-probe-guard.h openwrt/patches/fstools-probe-device-types.patch | sha256sum | cut -d' ' -f1)"
          echo "key=$k" >> "$GITHUB_OUTPUT"
          echo "key=$k"

      - name: Restore block-mount APK
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: work/
          key: ${{ steps.key.outputs.key }}

      - name: Build block-mount APK (native x86, cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: sh openwrt/build-block-mount.sh "$PWD/work/block-mount-mu300.apk"

      - name: Save block-mount APK (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: work/
          key: ${{ steps.key.outputs.key }}

      - name: Upload block-mount APK
        uses: actions/upload-artifact@v4
        with:
          name: blockmount-apk
          path: work/block-mount-mu300.apk*
          if-no-files-found: error
          retention-days: 1

  wifisae:
    needs: resolve
    if: needs.resolve.outputs.skip != 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          fetch-depth: 1

      # own: build-hostapd.sh forces --platform linux/amd64, but the build legs are
      # arm64, so running it there would need amd64 emulation (QEMU). Build the
      # wifi-sae APKs once here on a native x86 runner instead; on the arm leg
      # build-hostapd.sh finds the verified cache and skips docker. Same pattern as
      # block-mount, no QEMU anywhere.
      - name: Compute cache key
        id: key
        run: |
          # same inputs as the stamp inside openwrt/build-hostapd.sh
          k="wifisae-$(cat openwrt/build-hostapd.sh openwrt/build-hostapd-inner.sh openwrt/hostapd.Dockerfile openwrt/patch-hostapd-sae.py openwrt/hostapd-unisoc-sae.h openwrt/hostapd-unisoc.sh openwrt/hostapd-unisoc.uc openwrt/wifi-sae-state.py | sha256sum | cut -d' ' -f1)"
          echo "key=$k" >> "$GITHUB_OUTPUT"
          echo "key=$k"

      - name: Restore wifi-sae APKs
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: work/wifi-sae
          key: ${{ steps.key.outputs.key }}

      - name: Build wifi-sae APKs (native x86, cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # own: build-hostapd-inner.sh runs `make defconfig` then builds the hostapd
          # package straight away, but a fresh OpenWrt tree has no host tools/toolchain
          # yet (kano relies on a persistent docker volume), so the package build dies
          # on a missing staging_dir/host/bin/openssl. Build the prerequisites first.
          sed -i 's|^make defconfig$|make defconfig\nmake -j"$(nproc)" tools/install toolchain/install|' openwrt/build-hostapd-inner.sh
          grep -n 'tools/install toolchain/install' openwrt/build-hostapd-inner.sh
          sh openwrt/build-hostapd.sh "$PWD/work/wifi-sae"

      - name: Save wifi-sae APKs (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: work/wifi-sae
          key: ${{ steps.key.outputs.key }}

      - name: Package wifi-sae APKs
        run: tar -czf wifi-sae-apks.tar.gz -C work/wifi-sae .

      - name: Upload wifi-sae APKs
        uses: actions/upload-artifact@v4
        with:
          name: wifisae-apks
          path: wifi-sae-apks.tar.gz
          retention-days: 1

  build:
    needs: [resolve, vendor54, blockmount, wifisae]
    if: needs.resolve.outputs.skip != 'yes'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        line: ['6.18', '7.2']
    env:
      UPSTREAM_REPO: kanoqwq/mu300-linux
      KV: ${{ matrix.line == '6.18' && needs.resolve.outputs.kv618 || needs.resolve.outputs.kv72 }}
      OUTDIR: ${{ matrix.line == '6.18' && 'out' || 'out-7.2' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          fetch-depth: 1

      # own: take the block-mount APK from the native x86 job; build-rootfs.sh
      # -> build-block-mount.sh finds the verified cache and skips docker, so
      # no amd64 emulation is needed on this arm runner.
      - name: Fetch block-mount APK (native x86 build)
        uses: actions/download-artifact@v4
        with:
          name: blockmount-apk
          path: work/

      # own: same pattern for the wifi-sae APKs (native x86 job); build-rootfs.sh ->
      # build-hostapd.sh finds the verified cache and skips the amd64 docker build, so
      # this arm runner needs no amd64 emulation.
      - name: Fetch wifi-sae APKs (native x86 build)
        uses: actions/download-artifact@v4
        with:
          name: wifisae-apks
          path: wifisae-dl
      - name: Unpack wifi-sae APKs
        run: |
          mkdir -p work/wifi-sae
          tar -xzf wifisae-dl/wifi-sae-apks.tar.gz -C work/wifi-sae
          ls -la work/wifi-sae/

      - name: Fetch device inputs (private)
        env:
          INPUTS_SSH_KEY: ${{ secrets.INPUTS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$INPUTS_SSH_KEY" > ~/.ssh/inputs_key
          chmod 600 ~/.ssh/inputs_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/inputs_key -o StrictHostKeyChecking=no"
          git clone --depth 1 git@github.com:8099bb4X21/mu300-device-inputs.git device-inputs
          rm -f ~/.ssh/inputs_key
          ls device-inputs/

      - name: Static tools (busybox, logdw, bt-init, keys)
        run: |
          mkdir -p work/tools/logdw work/tools/bt-init work/tools/keys work/out
          sudo apt-get update -qq
          apt-get download busybox-static >/dev/null
          dpkg-deb -x busybox-static_*.deb bbdir
          BB_BIN=$(find bbdir -name busybox -type f | head -1)
          [ -n "$BB_BIN" ] || { echo "no busybox in deb:"; find bbdir | head -10; exit 1; }
          cp "$BB_BIN" work/busybox
          chmod +x work/busybox
          ./work/busybox --list | grep -qx -e mdev -e losetup -e switch_root -e telnetd || \
            { echo "busybox missing required applets" >&2; ./work/busybox --list | head -5; exit 1; }
          gcc -O2 -static -o work/tools/logdw/logdw tools/logdw/logdw.c
          gcc -O2 -static -o work/tools/bt-init/mu300-bt-init tools/bt-init/mu300-bt-init.c
          gcc -O2 -static -o work/tools/keys/mu300-keys tools/keys/mu300-keys.c
          file work/busybox | grep -q "ARM aarch64" || { echo "busybox is not AArch64" >&2; exit 1; }
          for t in work/tools/logdw/logdw work/tools/bt-init/mu300-bt-init work/tools/keys/mu300-keys; do
            file "$t" | grep -q "ARM aarch64" || { echo "$t is not AArch64" >&2; exit 1; }
          done
          cp -r device-inputs/dumps device-inputs/firmware device-inputs/android-subset work/

      - name: Vendor 5.4 modules (prebuilt)
        uses: actions/download-artifact@v4
        with:
          name: vendor54-modules
          path: vendor54-dl
      - name: Unpack vendor modules
        run: |
          mkdir -p work/out
          tar -xzf vendor54-dl/vendor54-modules.tar.gz -C work/out
          for f in wcn_bsp.ko sprd_wlan_combo.ko sprdbt_tty.ko mali_kbase.ko; do
            [ -s "work/out/modules/$f" ] || { echo "missing 5.4 module $f" >&2; exit 1; }
          done

      - name: Mainline kernel and modules (+ ksmbd fragment)
        run: |
          docker build -t mu300-mainline-build upstream/
          docker volume rm -f tf-mainline >/dev/null 2>&1 || true
          docker volume create tf-mainline
          # own: the F50 has no battery. The U30 charger driver (CONFIG_CHARGER_BQ256XX)
          # binds the F50's charger@6b and turns charging on, which resets the board on a
          # weak USB port (kano issue #225; its patch 0016 only guards the 0x1a fallback,
          # so it does not stop this 0x6b bind). Keep the F50 on the pre-U30 behaviour by
          # not building that driver. The fuel-gauge patches only look the supply up by
          # name (power_supply_get_by_name), so there is no symbol/link dependency.
          grep -v '^CONFIG_CHARGER_BQ256XX=' upstream/mu300-mainline.config > combined-mainline.config
          cat custom/ksmbd.fragment >> combined-mainline.config
          grep -q '^CONFIG_SMB_SERVER=m$' combined-mainline.config
          docker run --rm -e KV="$KV" -e OUTDIR="$OUTDIR" -v tf-mainline:/src -v "$PWD/upstream":/work \
            -v "$PWD/combined-mainline.config:/work/mu300-mainline.config:ro" \
            mu300-mainline-build bash /work/build.sh
          docker run --rm -e KV="$KV" -e OUTDIR="$OUTDIR" -v tf-mainline:/src -v "$PWD/upstream":/work \
            mu300-mainline-build bash /work/build-modules.sh > /dev/null
          test -s "upstream/$OUTDIR/modules/ksmbd.ko" || { echo "ksmbd.ko was not built" >&2; exit 1; }
          for f in wcn_bsp.ko sprd_wlan_combo.ko sprdbt_tty.ko mali_kbase.ko; do
            [ -s "work/out/modules/$f" ] || { echo "missing 5.4 module $f" >&2; exit 1; }
          done

      - name: TF Magisk zips (factory)
        run: |
          mkdir -p out-tf
          DATE=$(date -u +%Y%m%d)
          ZOUT="out-tf/mu300-linux-openwrt-tf-${{ matrix.line }}-$DATE.zip"
          ok=0
          for i in 1 2 3; do
            echo "==> TF build attempt $i/3"
            if MU300_KERNEL="${{ matrix.line }}" MU300_INPUTS="$PWD/work" \
                 MU300_DESKTOP_INSTALLER=0 \
                 MU300_POST_ROOTFS="$PWD/custom/post-rootfs.sh" \
                 sh tools/build-openwrt-tf-magisk.sh "$ZOUT"; then
              ok=1; break
            fi
            echo "==> attempt $i failed"
            [ "$i" = 3 ] || sleep 120
          done
          [ "$ok" = 1 ] || { echo "TF build failed after 3 attempts" >&2; exit 1; }
          ls -la out-tf/

      - name: Upload zips
        uses: actions/upload-artifact@v4
        with:
          name: tf-${{ matrix.line }}
          path: out-tf/*.zip
          retention-days: 1

  publish:
    needs: [resolve, build]
    if: needs.resolve.outputs.skip != 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          fetch-depth: 1
      - name: Collect all zips
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create single release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la assets/
          (cd assets && sha256sum *.zip > SHA256SUMS)
          cat assets/SHA256SUMS
          cp custom/release-notes.md NOTES.md
          {
            echo
            echo "---"
            echo "base: ${{ needs.resolve.outputs.head_sha }}"
            echo "inputs: ${{ needs.resolve.outputs.inputs_sha }}"
            echo "kernels: ${{ needs.resolve.outputs.kv618 }} ${{ needs.resolve.outputs.kv72 }}"
          } >> NOTES.md
          gh release create "${{ needs.resolve.outputs.tag }}" --title "自用 TF 卡包 (${{ needs.resolve.outputs.tag }})" --notes-file NOTES.md \
            assets/*.zip assets/SHA256SUMS
